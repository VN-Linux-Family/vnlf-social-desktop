name: vnlfsocialapp
description: Native client for the Vietnam Linux Family community.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  # Application-wide dependency injection and state management.
  flutter_riverpod: ^2.6.1
  # Declarative navigation and deep links.
  go_router: ^14.8.1
  # Platform-backed storage for session data.
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.3
  # Persist non-secret appearance preferences without a platform keyring.
  shared_preferences: ^2.5.6
  # Render SVG vector graphics matching web production assets.
  flutter_svg: ^2.0.17
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_linux: ^1.2.1
  video_player_win: ^3.3.1
  livekit_client: ^2.13.2
  markdown: ^7.3.1
  file_selector: ^1.1.0
  # Native rich editing; the server document schema uses a separate lossless codec.
  fleather: ^1.28.0
  flutter_local_notifications: ^22.3.3
  tray_manager: ^0.8.3
  window_manager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/distro-badges/
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
