name: Build Multiplatform

on:
  push:
    branches: [ main, 'release/**', 'v*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Linux Desktop (x64 / arm64 runner bundle)
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Compute SemVer + Commit Hash Version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          SEMVER_VERSION="${BASE_VERSION}+${SHORT_SHA}"
          echo "SEMVER_VERSION=${SEMVER_VERSION}" >> $GITHUB_ENV
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "Version: ${SEMVER_VERSION}"

      - name: Install dependencies & generate localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build Linux Release Bundle
        run: |
          flutter build linux --release \
            --build-name="${BASE_VERSION}" \
            --build-number="${SHORT_SHA}" \
            --dart-define="APP_VERSION=${SEMVER_VERSION}"

      - name: Package Linux Archive
        shell: bash
        run: |
          ARCHIVE_NAME="vnlfsocialapp-linux-${SEMVER_VERSION}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" -C build/linux/x64/release/bundle .
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnlfsocialapp-linux-${{ env.SEMVER_VERSION }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  # -------------------------------------------------------------
  # Windows Desktop (x64)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Compute SemVer + Commit Hash Version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          SEMVER_VERSION="${BASE_VERSION}+${SHORT_SHA}"
          echo "SEMVER_VERSION=${SEMVER_VERSION}" >> $GITHUB_ENV
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "Version: ${SEMVER_VERSION}"

      - name: Install dependencies & generate localizations
        shell: bash
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build Windows Release Executable
        shell: bash
        run: |
          flutter build windows --release \
            --build-name="${BASE_VERSION}" \
            --build-number="${SHORT_SHA}" \
            --dart-define="APP_VERSION=${SEMVER_VERSION}"

      - name: Package Windows Archive
        shell: bash
        run: |
          ARCHIVE_NAME="vnlfsocialapp-windows-${SEMVER_VERSION}.zip"
          cd build/windows/x64/runner/Release
          tar -a -c -f "../../../../${ARCHIVE_NAME}" *
          cd ../../../..
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnlfsocialapp-windows-${{ env.SEMVER_VERSION }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  # -------------------------------------------------------------
  # macOS Desktop (.app bundle / zip)
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Compute SemVer + Commit Hash Version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          SEMVER_VERSION="${BASE_VERSION}+${SHORT_SHA}"
          echo "SEMVER_VERSION=${SEMVER_VERSION}" >> $GITHUB_ENV
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "Version: ${SEMVER_VERSION}"

      - name: Install dependencies & generate localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build macOS Release Application
        run: |
          flutter build macos --release --no-codesign \
            --build-name="${BASE_VERSION}" \
            --build-number="${SHORT_SHA}" \
            --dart-define="APP_VERSION=${SEMVER_VERSION}"

      - name: Package macOS Archive
        shell: bash
        run: |
          ARCHIVE_NAME="vnlfsocialapp-macos-${SEMVER_VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/vnlfsocialapp.app "${ARCHIVE_NAME}"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnlfsocialapp-macos-${{ env.SEMVER_VERSION }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  # -------------------------------------------------------------
  # Android (APK / App Bundle)
  # -------------------------------------------------------------
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Compute SemVer + Commit Hash Version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          SEMVER_VERSION="${BASE_VERSION}+${SHORT_SHA}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "SEMVER_VERSION=${SEMVER_VERSION}" >> $GITHUB_ENV
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_ENV
          echo "Version: ${SEMVER_VERSION} (code: ${BUILD_NUMBER})"

      - name: Install dependencies & generate localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --build-name="${SEMVER_VERSION}" \
            --build-number="${BUILD_NUMBER}" \
            --dart-define="APP_VERSION=${SEMVER_VERSION}"

      - name: Package Android Artifact
        shell: bash
        run: |
          APK_NAME="vnlfsocialapp-android-${SEMVER_VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnlfsocialapp-android-${{ env.SEMVER_VERSION }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

  # -------------------------------------------------------------
  # GitHub Release (Triggered on Tags: v*)
  # -------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Compute Release Title and Tag
        id: release_meta
        shell: bash
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          SEMVER_VERSION="${BASE_VERSION}+${SHORT_SHA}"
          echo "SEMVER_VERSION=${SEMVER_VERSION}" >> $GITHUB_ENV
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VNLF Flutter v${{ env.SEMVER_VERSION }}"
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
